# Hugo
title = "Sprinto"
titleAddition = "Discord sprinting bot" # used for the homepage <title>, see layouts/_partials/seo/title.html
description = "Sprinto brings creators together."
images = ["images/default-image.png"]

# mainSections
mainSections = ["docs"]

# Enable mathematical rendering on every page (unless you set the `math` parameter to `false` in front matter)
math = false # false (default) or true
mathEngine = "KaTeX" # "KaTeX" (default) or "MathJax"

googleAnalytics = 'G-KJELGBPRHT'

[social]
  twitter = "sprintobot"

# Footer
footer = """<a class=\"text-muted\" href=\"https://discord.gg/7ZSuEgM\">Join Sprinto's Support Server</a>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-KJELGBPRHT"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-KJELGBPRHT');
</script>
"""

# Alert
alertText = "Introducing Sprinto!"

# Doks (@thulite/doks-core)
[doks]
  # Color mode
  colorMode = "auto" # auto (default), light or dark
  colorModeToggler = true # true (default) or false (this setting is only relevant when colorMode = auto)

  # Navbar
  navbarSticky = true # true (default) or false
  containerBreakpoint = "xxl" # "", "sm", "md", "lg", "xl", "xxl", or "fluid" (default)

  ## Button
  navBarButton = false # false (default) or true
  navBarButtonUrl = "/docs/invite-sprinto/"
  navBarButtonText = "Invite Sprinto"

  # FlexSearch
  flexSearch = true # true (default) or false
  searchExclKinds = [] # list of page kinds to exclude from search indexing
  searchExclTypes = [] # list of content types to exclude from search indexing
  showSearch = [] # [] (all pages, default) or homepage (optionally) and list of sections
  indexSummary = false # true or false (default)

  ## Search results
  showDate = false # false (default) or true
  showSummary = true # true (default) or false
  searchLimit = 99 # 0 (no limit, default) or natural number

  # Global alert
  alert = false # false (default) or true
  alertDismissable = true # true (default) or false

  # Bootstrap
  bootstrapJavascript = true # false (default) or true

  # Nav
  sectionSwitcher = false # true or false (default)
  sectionNav = ["docs", "blog"] # ["docs"] (default) or list of sections
  toTopButton = false # false (default) or true
  breadcrumbTrail = false # false (default) or true
  headlineHash = true # true (default) or false
  scrollSpy = false # true (default) or false

  # Multilingual
  multilingualMode = false # false (default) or true
  showMissingLanguages = true # true (default) or false

  # Versioning
  docsVersioning = false # false (default) or true
  docsVersion = "1.0"

  # UX
  headerBar = false # true (default) or false
  backgroundDots = false # true (default) or false
  aiButtons = true # true (default) or false

  # Homepage
  sectionFooter = false # false (default) or true

  # Blog
  relatedPosts = false # false (default) or true
  imageList = true # true (default) or false
  imageSingle = true # true (default) or false

  # Repository
  editPage = false # false (default) or true
  lastMod = false # false (default) or true
  repoHost = "GitHub" # GitHub (default), Gitea, GitLab, Bitbucket, or BitbucketServer
  docsRepo = "https://github.com/pengowray/doks-sprinto"
  docsRepoBranch = "master" # main (default), master, or <branch name>
  docsRepoSubPath = "docs" # "" (none, default) or <sub path>

  krokiURL = "https://kroki.io"

  [doks.menu]
    [doks.menu.section]
      auto = true # true (default) or false
      collapsibleSidebar = false # true (default) or false

# Render hooks
[render_hooks.image]
  errorLevel = 'ignore' # ignore (default), warning, or error (fails the build)

[render_hooks.link]
  errorLevel = 'ignore' # ignore (default), warning, or error (fails the build)
  highlightBroken = false # true or false (default)

# Images (@thulite/images)
[thulite_images]
  [thulite_images.defaults]
    decoding = "async" # sync, async, or auto (default)
    fetchpriority = "auto" # high, low, or auto (default)
    loading = "lazy" # eager or lazy (default)
    widths = [480, 720, 1080, 1280, 1600, 2048]
    sizes = "auto" # 100vw (default), 75vw, or auto for example
    process = "" # "fill 1600x900" or "fill 2100x900" for example
    lqip = "20x webp q20" # "16x webp q20" or "21x webp q20" for example

# Inline SVG (@thulite/inline-svg)
[inline_svg]
  iconSetDir = "tabler-icons" # tabler-icons (default)
  iconSetVariant = "outline" # outline (default) or filled

# SEO (@thulite/seo)
[seo]
  [seo.title]
    separator = "-" # "|" (default)
    suffix = "" # site title (default)
  [seo.description]
    summaryFallback = true # fall back to the page summary, as the old theme did
    siteParamsFallback = true # then to the site description
    [seo.description.length]
      errorLevel = 'ignore' # ignore, warning (default), or error
  [seo.favicons]
    icon = "favicon.png" # favicon.png (default)
    svgIcon = "favicon.svg" # favicon.svg (default)
  [seo.schemas]
    type = "Organization" # Organization (default) or Person
    logo = "favicon-512x512.png"
    name = "Sprinto Discord Bot"
    sameAs = [
      "https://github.com/pengowray/sprinto",
      "https://bsky.app/profile/sprintobot.com",
      "https://twitter.com/sprintobot",
    ]
    images = ["images/default-image.png"]
    article = []
    newsArticle = []
    blogPosting = ["blog"]
    product = []
