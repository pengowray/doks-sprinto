title = "Sprinto"
baseurl = "https://sprintobot.com/"
# baseurl = "https://morse.games/sprinto"
canonifyURLs = false
copyright = "Copyright (c) 2023 Pengo Wray"
disableAliases = false # generate redirect pages for `aliases` in front matter (e.g. old /docs/ping-roles/)
disableHugoGeneratorInject = true
enableEmoji = true
enableGitInfo = false
enableRobotsTXT = true
locale = "en-US"
rssLimit = 10

[pagination]
pagerSize = 7

# Multilingual
defaultContentLanguage = "en"
disableLanguages = ["de", "nl"]
# defaultContentLanguageInSubdir = true

# hugo_stats.json feeds PurgeCSS (see config/postcss.config.js)
[build.buildStats]
  enable = true

[outputs]
home = ["html", "rss", "sitemap", "searchIndex", "llms"]
page = ["html"]
section = ["html", "rss", "sitemap"]

# add output format for the FlexSearch index
[outputFormats.searchIndex]
mediaType = "application/json"
baseName = "search-index"
isPlainText = true
notAlternative = true

# add output format for llms.txt
[outputFormats.llms]
baseName = "llms"
isHTML = false
isPlainText = true
mediaType = "text/plain"

# add output format for section sitemap.xml
[outputFormats.sitemap]
mediaType = "application/xml"
baseName = "sitemap"
isHTML = false
isPlainText = true
noUgly = true
rel  = "sitemap"

[caches]
  [caches.getresource]
    dir = ":cacheDir/:project"
    maxAge = "10s"

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[taxonomies]
  contributor = "contributors"
  category = "categories"
  tag = "tags"

[permalinks]
  blog = "/blog/:title/"
# docs = "/docs/1.0/:sections[1:]/:title/"
  docs = "/docs/:title/"
# termscond = "/:slug"

[minify.tdewolff.html]
  keepComments = true # if false, the build signature is stripped
  keepWhitespace = false

[related]
  threshold = 80
  includeNewer = true
  toLower = false
    [[related.indices]]
    name = "categories"
    weight = 100
    [[related.indices]]
    name = "tags"
    weight = 80
    [[related.indices]]
    name = "date"
    weight = 10

[imaging]
  anchor = "Center"
  bgColor = "#ffffff"
  resampleFilter = "Lanczos"
  [imaging.jpeg]
    quality = 85
  [imaging.webp]
    hint = "photo"
    quality = 85
