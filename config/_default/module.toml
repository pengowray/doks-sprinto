# Module Configuration File
#
# Mounts tell Hugo which directories to use when building the site. The Thulite
# modules live in node_modules; the first mount that supplies a given file wins,
# so project mounts come first and override the modules.

[hugoVersion]
  extended = true
  min = "0.146.0"
  max = ""

## content
# NOTE: no content mount here on purpose. This site is multilingual-shaped —
# config/_default/languages.toml sets contentDir = "content/en", which Hugo turns
# into its own language-tagged mount. Adding "content" -> "content" as well would
# mount every page a second time without a language.

## data
[[mounts]]
  source = "data"
  target = "data"

[[mounts]]
  source = "node_modules/@thulite/doks-core/data"
  target = "data"

## layouts
[[mounts]]
  source = "layouts"
  target = "layouts"

[[mounts]]
  files = ['! home.html']
  source = "node_modules/@thulite/doks-core/layouts"
  target = "layouts"

[[mounts]]
  source = "node_modules/@thulite/core/layouts"
  target = "layouts"

[[mounts]]
  source = "node_modules/@thulite/seo/layouts"
  target = "layouts"

[[mounts]]
  source = "node_modules/@thulite/images/layouts"
  target = "layouts"

[[mounts]]
  source = "node_modules/@thulite/inline-svg/layouts"
  target = "layouts"

## i18n
[[mounts]]
  source = "i18n"
  target = "i18n"

[[mounts]]
  source = "node_modules/@thulite/doks-core/i18n"
  target = "i18n"

## archetypes
[[mounts]]
  source = "archetypes"
  target = "archetypes"

[[mounts]]
  source = "node_modules/@thulite/doks-core/archetypes"
  target = "archetypes"

## assets
[[mounts]]
  source = "assets"
  target = "assets"

[[mounts]]
  source = "node_modules/@thulite/core/assets"
  target = "assets"

[[mounts]]
  # js/search-modal.js is excluded so the project copy in assets/js is the one
  # that gets built. See the comment at the top of that file for why it exists.
  files = ["! js/search-modal.js"]
  source = "node_modules/@thulite/doks-core/assets"
  target = "assets"

[[mounts]]
  source = "node_modules/@thulite/images/assets"
  target = "assets"

[[mounts]]
  source = "node_modules/@tabler/icons/icons"
  target = "assets/svgs/tabler-icons"

[[mounts]]
  source = "hugo_stats.json"
  target = "assets/watching/hugo_stats.json"

# The @thulite/images render hook resolves markdown image destinations against
# assets, and most of this site's screenshots live under static/images.
[[mounts]]
  source = "static"
  target = "assets"

## static
[[mounts]]
  source = "static"
  target = "static"

[[mounts]]
  source = "node_modules/@thulite/doks-core/static"
  target = "static"
